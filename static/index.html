<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="错题本助手">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="icon" href="/static/icons/icon-192.png">
    <title>错题本知识溯源整理助手</title>
    <link rel="stylesheet" href="/static/style.css?v=20260919a">
    <script src="/static/vue.global.js"></script>
    <script src="/static/axios.min.js"></script>
    <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
    <script src="/static/vendor/katex/katex.min.js"></script>
    <script src="/static/vendor/echarts.min.js"></script>
</head>
<body>
<div id="app">
    <!-- 登录 / 注册 -->
    <div v-if="!authUser" class="auth-page">
        <form class="auth-card" @submit.prevent="submitAuth">
            <div class="auth-logo">错题本</div>
            <h2>错题本知识溯源整理助手</h2>
            <p class="auth-sub">{{ authMode === 'login' ? '登录你的账号' : '注册新账号' }}</p>
            <input v-model.trim="authUsername" type="text" placeholder="账号（英文或数字）" autocomplete="username">
            <input v-model="authPassword" type="password" placeholder="密码（英文或数字）" autocomplete="current-password">
            <input v-if="authMode === 'register'" v-model="authConfirm" type="password" placeholder="再次输入密码" autocomplete="new-password">
            <p v-if="authError" class="auth-error">{{ authError }}</p>
            <button class="btn-primary auth-submit" type="submit" :disabled="authLoading">
                {{ authLoading ? '处理中...' : (authMode === 'login' ? '登 录' : '注册并登录') }}
            </button>
            <button type="button" class="auth-switch" @click="toggleAuthMode">
                {{ authMode === 'login' ? '还没有账号？去注册' : '已有账号？返回登录' }}
            </button>
            <button type="button" class="auth-switch" v-if="authMode === 'login'" @click="openResetModal">忘记密码？重置密码</button>
            <p class="auth-rule">账号和密码只能使用英文字母和数字</p>
        </form>
    </div>

    <template v-else>
    <div v-if="loading" class="loading-mask">加载中...</div>
    <div v-if="error" class="error-toast">{{ error }}</div>
    <div class="app-shell">
        <aside class="app-sidebar" :class="{open: mobileMenuOpen}">
            <button type="button" class="mobile-close" @click="mobileMenuOpen=false">×</button>
            <div class="side-brand">
                <div class="side-logo">错</div>
                <div>
                    <div class="side-title">错题本</div>
                    <div class="side-subtitle">知识溯源助手</div>
                </div>
            </div>
            <nav class="side-nav">
                <button v-for="nav in navs" :key="nav.key" :class="{active: isNavActive(nav)}" @click="goTo(nav.key)">
                    <span>{{ nav.label }}</span>
                    <span v-if="nav.key==='review' && reviewPlanCounts.total" class="nav-badge">{{ reviewPlanCounts.total }}</span>
                </button>
            </nav>
            <div class="side-user">
                <div class="side-username">{{ authUser.username }}</div>
                <button type="button" @click="openLlmConfig">模型与 OCR 配置</button>
                <button type="button" @click="openAccountModal">账号设置</button>
                <button type="button" @click="switchUser">切换用户</button>
            </div>
        </aside>
        <div class="mobile-overlay" v-if="mobileMenuOpen" @click="mobileMenuOpen=false"></div>
        <div class="app-content">
            <div class="mobile-topbar">
                <button type="button" class="mobile-menu-btn" @click="mobileMenuOpen=true">☰</button>
                <div class="mobile-page-title">错题本助手</div>
                <button type="button" class="mobile-user-btn" @click="openAccountModal">{{ authUser.username }}</button>
            </div>
            <header class="app-header">
                <div class="header-title">
                    <h1>错题本知识溯源整理助手</h1>
                    <p class="slogan">不只是记错题，更是找到错题的根。</p>
                </div>
            </header>

            <main class="app-main">
        <!-- 仪表盘 -->
        <section v-if="currentNav==='dashboard'" class="section">
            <h2>今日概览</h2>
            <div class="cards">
                <div class="card">
                    <div class="card-title">总错题数</div>
                    <div class="card-value">{{ dashboardStats.total }}</div>
                </div>
                <div class="card">
                    <div class="card-title">未掌握</div>
                    <div class="card-value">{{ unmasteredCount }}</div>
                </div>
                <div class="card">
                    <div class="card-title">薄弱知识点 TOP3</div>
                    <ul class="card-list">
                        <li v-for="w in weakPoints.slice(0,3)" :key="w.id">{{ w.name }} <span class="badge">{{ w.weak_index }}</span></li>
                        <li v-if="weakPoints.length===0">暂无数据</li>
                    </ul>
                </div>
            </div>
            <h3 style="margin-top:20px">最近错题</h3>
            <div class="question-list">
                <div class="q-item" v-for="q in recentQuestions" :key="q.id" @click="openQuestion(q)">
                    <div class="q-title">{{ q.title_text || '(无标题)' }}</div>
                    <div class="q-meta">
                        <span class="tag">{{ q.subject_name || '未分类' }}</span>
                        <span class="tag" :class="'status-'+q.status">{{ statusText(q.status) }}</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 错题录入 -->
        <section v-if="currentNav==='input'" class="section">
            <h2>错题录入</h2>
            <div class="form">
                <div class="form-row">
                    <label>学科</label>
                    <select v-model="form.subject_id">
                        <option v-for="s in subjects" :key="s.id" :value="s.id">{{ s.name }}</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>导入试卷</label>
                    <div class="upload-actions">
                        <button type="button" class="upload-btn" @click="$refs.importFileInput.click()">导入 PDF / Word 试卷</button>
                        <input ref="importFileInput" type="file" accept=".pdf,.doc,.docx" @change="handleImportFile" hidden>
                    </div>
                    <div v-if="importLoading" class="ocr-status">正在解析试卷，扫描版可能需要较长时间...</div>
                    <p v-if="importMessage" class="add-hint">{{ importMessage }}</p>
                </div>
                <div class="form-row">
                    <label>题干文本</label>
                    <textarea v-model="form.title_text" rows="4" placeholder="输入题目，支持 LaTeX：$x^2$ 或 $$公式$$"></textarea>
                    <div v-if="form.title_text" class="latex-preview" v-html="latexHtml(form.title_text)"></div>
                </div>
                <div class="form-row">
                    <label>题干图片</label>
                    <div class="upload-actions">
                        <button type="button" class="upload-btn camera-btn" @click="openCamera">📷 拍摄题目</button>
                        <button type="button" class="upload-btn" @click="$refs.fileInput.click()">🖼 选择图片</button>
                        <input ref="fileInput" type="file" accept="image/*" @change="handleImageUpload" hidden>
                        <input ref="captureInput" type="file" accept="image/*" capture="environment" @change="handleImageUpload" hidden>
                    </div>
                    <div v-if="form.ocrLoading" class="ocr-status">OCR 识别中，请稍候...</div>
                    <img v-if="form.title_image" :src="form.title_image" class="preview-img">
                </div>
                <div class="form-row">
                    <label>正确答案</label>
                    <textarea v-model="form.correct_answer" rows="2"></textarea>
                </div>
                <div class="form-row">
                    <label>学生答案</label>
                    <textarea v-model="form.user_answer" rows="2"></textarea>
                </div>
                <div class="form-row">
                    <label>解析</label>
                    <textarea v-model="form.analysis" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <label>错误原因</label>
                    <input type="text" v-model="form.mistake_reason">
                </div>
                <div class="form-row">
                    <label>当前状态</label>
                    <select v-model.number="form.status">
                        <option :value="0">未掌握</option>
                        <option :value="1">已掌握</option>
                        <option :value="2">已复习</option>
                        <option :value="3">已归档</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>关联知识点</label>
                    <div class="kp-tags">
                        <span class="kp-tag" v-for="(kp, idx) in form.knowledge_points" :key="kp.id">
                            {{ kp.name }} <small>({{ (kp.confidence*100).toFixed(0) }}%)</small>
                            <button type="button" @click="removeKp(idx)" style="background:#dc2626;color:#ffffff;border:1px solid #991b1b;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer;margin-left:6px;line-height:1.5">删除</button>
                        </span>
                        <button type="button" class="btn-sm" @click="showKpSelector=true">+ 添加</button>
                        <button type="button" class="btn-sm btn-ai" @click="recommendKp" :disabled="recommending">
                            {{ recommending ? 'AI推荐中...' : 'AI推荐知识点' }}
                        </button>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn-primary" @click="saveQuestion">保存错题</button>
                    <button class="btn" @click="resetForm">重置</button>
                </div>
            </div>
        </section>

        <!-- 错题库 -->
        <section v-if="currentNav==='library'" class="section">
            <h2>错题库</h2>
            <div class="lib-tabs">
                <button type="button" :class="{active: !trashMode}" @click="closeTrash">错题列表</button>
                <button type="button" :class="{active: trashMode}" @click="openTrash">回收站</button>
            </div>
            <template v-if="!trashMode">
                <div class="filters">
                    <select v-model.number="filter.subject_id" @change="onFilterSubjectChange">
                        <option :value="null">全部学科</option>
                        <option v-for="s in subjects" :key="s.id" :value="s.id">{{ s.name }}</option>
                    </select>
                    <select v-model.number="filter.kp_id" @change="onLibraryFilterChange">
                        <option :value="null">全部知识点</option>
                        <option v-for="k in filterKps" :key="k.id" :value="k.id">{{ '　'.repeat(k.level) }}{{ k.name }}</option>
                    </select>
                    <select v-model.number="filter.status" @change="onLibraryFilterChange">
                        <option :value="null">全部状态</option>
                        <option :value="0">未掌握</option>
                        <option :value="1">已掌握</option>
                        <option :value="2">已复习</option>
                        <option :value="3">已归档</option>
                    </select>
                    <input type="text" v-model="filter.keyword" placeholder="搜索题干" @input="onLibrarySearch">
                </div>
                <div class="batch-toolbar">
                    <label class="batch-check">
                        <input type="checkbox" :checked="allLibraryPageSelected" @change="toggleSelectAllQuestions">
                        全选本页（已选 {{ selectedQuestionIds.length }} 题）
                    </label>
                    <select v-model="batchAction" @change="handleBatchAction">
                        <option value="">选择操作</option>
                        <option value="bind_kp">关联知识点</option>
                        <option value="status">修改状态</option>
                        <option value="delete">删除</option>
                    </select>
                    <template v-if="batchAction==='status'">
                        <select v-model.number="batchStatus">
                            <option :value="0">未掌握</option>
                            <option :value="1">已掌握</option>
                            <option :value="2">已复习</option>
                            <option :value="3">已归档</option>
                        </select>
                        <button type="button" class="btn-sm" @click="batchUpdateStatus">应用状态</button>
                    </template>
                </div>
                <div class="question-list">
                    <p v-if="libraryLoading" class="empty-tip">正在加载错题...</p>
                    <p v-else-if="!libraryItems.length" class="empty-tip">当前筛选条件下没有错题。</p>
                    <div class="q-item" v-for="q in libraryItems" :key="q.id">
                        <div class="q-check-title">
                            <input type="checkbox" :checked="selectedQuestionIds.includes(q.id)" @change="toggleQuestionSelect(q.id)">
                            <div class="q-title" @click="openQuestion(q)">{{ q.title_text || '(无标题)' }}</div>
                        </div>
                        <div class="q-meta">
                            <span class="tag">{{ q.subject_name || '未分类' }}</span>
                            <span class="tag" :class="'status-'+q.status">{{ statusText(q.status) }}</span>
                            <span class="tag" v-for="kp in q.knowledge_points" :key="kp.id">{{ kp.name }}</span>
                        </div>
                        <div class="q-actions">
                            <button class="btn-sm" @click="editQuestion(q)">编辑</button>
                            <button type="button" @click="deleteQuestion(q)" style="background:#dc2626;color:#ffffff;border:2px solid #991b1b;border-radius:6px;padding:6px 14px;font-size:15px;font-weight:700;cursor:pointer">删除</button>
                        </div>
                    </div>
                </div>
                <div class="pagination" v-if="!libraryLoading && libraryTotal > 0">
                    <span class="pagination-summary">共 {{ libraryTotal }} 题 · 第 {{ libraryPage }} / {{ libraryPages }} 页</span>
                    <button type="button" class="btn-sm" :disabled="libraryPage <= 1" @click="goLibraryPage(libraryPage - 1)">上一页</button>
                    <button
                        type="button"
                        class="btn-sm page-number"
                        :class="{active: page === libraryPage}"
                        v-for="page in libraryPageNumbers"
                        :key="page"
                        @click="goLibraryPage(page)"
                    >{{ page }}</button>
                    <button type="button" class="btn-sm" :disabled="libraryPage >= libraryPages" @click="goLibraryPage(libraryPage + 1)">下一页</button>
                </div>
            </template>
            <template v-else>
                <p v-if="!trashQuestions.length" class="empty-tip">回收站是空的。</p>
                <div class="question-list">
                    <div class="q-item" v-for="q in trashQuestions" :key="q.id">
                        <div class="q-title">{{ q.title_text || '(无标题)' }}</div>
                        <div class="q-meta">
                            <span class="tag">{{ q.subject_name || '未分类' }}</span>
                            <span class="tag">已删除</span>
                        </div>
                        <div class="q-actions">
                            <button type="button" class="btn-sm btn-primary" @click="restoreQuestion(q)">恢复</button>
                            <button type="button" class="btn-sm" @click="purgeQuestion(q)" style="background:#dc2626;color:#fff;border-color:#991b1b">彻底删除</button>
                        </div>
                    </div>
                </div>
            </template>
        </section>

        <!-- 薄弱分析 -->
        <section v-if="currentNav==='weak'" class="section">
            <h2>薄弱知识图谱</h2>
            <div class="filters">
                <select v-model.number="weakFilter.subject_id" @change="loadWeak">
                    <option v-for="s in subjects" :key="s.id" :value="s.id">{{ s.name }}</option>
                </select>
                <span class="filter-label" v-if="currentWeakSubjectName">当前学科：{{ currentWeakSubjectName }}</span>
            </div>
            <div class="weak-table">
                <table>
                    <thead>
                        <tr><th>知识点</th><th>学科</th><th>错题数</th><th>未掌握</th><th>累计错误</th><th>近7天</th><th>薄弱指数</th></tr>
                    </thead>
                    <tbody>
                        <tr v-for="w in weakPoints" :key="w.id">
                            <td>{{ w.name }}</td>
                            <td>{{ w.subject_name }}</td>
                            <td>{{ w.question_count }}</td>
                            <td>{{ w.unmastered_count }}</td>
                            <td>{{ w.error_count }}</td>
                            <td>{{ w.recent_errors }}</td>
                            <td><span class="badge" :style="{background: heatColor(w.weak_index)}">{{ w.weak_index }}</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <h3 style="margin-top:24px">近 30 天错误趋势</h3>
            <div ref="trendChartEl" class="chart-box"></div>
            <h3 style="margin-top:24px">复习优先级建议</h3>
            <p v-if="!priorityData.length" class="empty-tip">暂无可分析的薄弱知识点。</p>
            <div class="priority-list" v-else>
                <div v-for="p in priorityData" :key="p.id" class="priority-item">
                    <span class="priority-badge" :class="'p-' + p.priority">{{ p.priority }}优先</span>
                    <div class="priority-main">
                        <strong>{{ p.name }}</strong>
                        <span>{{ p.suggestion }}</span>
                    </div>
                    <span class="priority-score">薄弱指数 {{ p.weak_index }}</span>
                </div>
            </div>
            <h3 style="margin-top:24px">搭建 {{ currentWeakSubjectName || '当前学科' }} 知识树</h3>
            <div class="weak-kp-add">
                <input type="text" v-model="weakKpName" @keyup.enter="addWeakKp" placeholder="新知识点名称，如：三角函数" ref="weakKpInput">
                <select v-model.number="weakParentId">
                    <option :value="null">作为一级知识点</option>
                    <option v-for="k in kpTree" :key="k.id" :value="k.id">{{ '　'.repeat(k.level) }}{{ k.name }}</option>
                </select>
                <button class="btn-primary" @click="addWeakKp">添加</button>
            </div>
            <p v-if="weakAddHint" class="add-hint">将添加为「{{ weakAddHint }}」的子知识点</p>
            <div v-if="!kpTree.length" class="empty-tip">
                当前学科还没有知识点，在上方输入名称并点击「添加」，先建出一级知识点。
            </div>
            <div class="kp-tree" v-else>
                <div v-for="n in kpTree" :key="n.id" class="tree-branch" :class="{'tree-root': n.level===0}">
                    <div class="tree-node-row" :style="{marginLeft: n.level*26+'px'}">
                        <span class="tree-marker" v-if="n.level>0">└─</span>
                        <span class="tree-dot" v-else>●</span>
                        <span class="tree-node-name">{{ n.name }}</span>
                        <span class="badge" v-if="n.question_count">错题 {{ n.question_count }}</span>
                        <button type="button" class="mini-btn" @click="openAiMaterial(n, 'concept')">概念回顾</button>
                        <button type="button" class="mini-btn" @click="openTypicalExamples(n)">典型例题</button>
                        <button type="button" class="mini-btn" @click="openTypicalExamples(n, 'variant')">变式练习</button>
                        <button type="button" class="mini-btn" @click="startChildKp(n)">+ 子级</button>
                        <button type="button" class="mini-btn mini-danger" @click="deleteWeakKp(n)">删除</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 知识图谱 -->
        <section v-if="currentNav==='graph'" class="section">
            <h2>知识图谱</h2>
            <div class="filters">
                <select v-model.number="graphFilter.subject_id" @change="loadGraph">
                    <option v-for="s in subjects" :key="s.id" :value="s.id">{{ s.name }}</option>
                </select>
                <span class="filter-label">点击节点查看知识点详情与 AI 精要</span>
            </div>
            <div class="graph-legend">
                <span><i class="legend-dot center"></i>学科中心</span>
                <span><i class="legend-dot level1"></i>一级分类</span>
                <span><i class="legend-dot level2"></i>细分知识点</span>
                <span><i class="legend-dot level3"></i>更深层级</span>
            </div>
            <div class="graph-mode-tabs">
                <button type="button" :class="{active: graphChartMode==='layered'}" @click="switchGraphMode('layered')">分层导图</button>
                <button type="button" :class="{active: graphChartMode==='tree'}" @click="switchGraphMode('tree')">树图</button>
                <button type="button" :class="{active: graphChartMode==='sunburst'}" @click="switchGraphMode('sunburst')">旭日图</button>
            </div>
            <div class="graph-mobile" v-if="graphSubject">
                <div class="graph-mobile-head">
                    <button type="button" class="btn" v-if="graphMobilePath.length" @click="backGraphMobile">← 返回上一级</button>
                    <div class="graph-mobile-breadcrumb">
                        {{ graphSubject.name }}
                        <span v-for="item in graphMobilePath" :key="item.id"> > {{ item.name }}</span>
                    </div>
                </div>
                <div class="graph-mobile-list">
                    <div v-for="n in graphMobileChildren" :key="n.id" class="graph-mobile-item">
                        <button type="button" class="graph-mobile-main" @click="openGraphMobileNode(n)">
                            <span>{{ n.name }}</span>
                            <span class="graph-mobile-count" v-if="n.question_count">{{ n.question_count }}</span>
                            <span class="graph-mobile-arrow" v-if="graphNodes.some(x => x.parent_id === n.id)">›</span>
                        </button>
                        <button type="button" class="mini-btn" @click="openGraphNode(n)">详情</button>
                    </div>
                    <p v-if="!graphMobileChildren.length" class="empty-tip">当前层级没有子知识点。</p>
                </div>
            </div>
            <div class="graph-canvas" v-if="graphSubject" v-show="graphChartMode==='layered'">
                <div class="graph-center">{{ graphSubject.name }}</div>
                <div class="graph-levels">
                    <div v-for="layer in graphLevels" :key="layer.level" class="graph-layer">
                        <div class="graph-level-title">{{ layer.level === 0 ? '一级分类' : ('第 ' + (layer.level + 1) + ' 层') }}</div>
                        <button type="button" v-for="n in layer.nodes" :key="n.id" class="graph-node" @click="openGraphNode(n)">
                            <span class="graph-node-name">{{ n.name }}</span>
                            <span class="graph-node-count" v-if="n.question_count">{{ n.question_count }}</span>
                        </button>
                    </div>
                </div>
            </div>
            <div v-show="graphChartMode !== 'layered'" ref="graphChartEl" class="chart-box graph-chart"></div>
            <p v-if="!graphSubject" class="empty-tip">当前学科还没有知识点，请先到「学科设置」搭建知识树。</p>
        </section>

        <!-- 统计报表 -->
        <section v-if="currentNav==='report'" class="section">
            <h2>统计报表</h2>
            <div class="filters">
                <select v-model.number="reportFilter.subject_id" @change="loadReport">
                    <option v-for="s in subjects" :key="s.id" :value="s.id">{{ s.name }}</option>
                </select>

                        {title:'逾期', items:reviewPlanGroups.overdue},

                    </div>

                    </div>
                    <div class="review-detail-actions">

                        <span class="trace-name">{{ p.name }}</span>
                        <span class="tag" v-if="p.exists">已有</span>
                        <span class="tag" v-else>新增</span>
                        <span class="trace-confidence">{{ Math.round((p.confidence || 0) * 100) }}%</span>
                        <small>{{ p.reason }}</small>
                    </label>
                </div>
                <div class="trace-block">
                    <label>根因分析</label>
                    <div class="review-detail-text" v-html="latexHtml(traceModal.data.root_cause)"></div>
                </div>
                <div class="trace-block" v-if="traceModal.data.path && traceModal.data.path.length">
                    <label>溯源路径</label>
                    <div class="trace-path">{{ traceModal.data.path.join('  →  ') }}</div>
                </div>
            </template>
            <div class="modal-actions">
                <button class="btn-primary" v-if="traceModal.data" @click="confirmTrace" :disabled="traceModal.saving">{{ traceModal.saving ? '生成中...' : '生成知识溯源导图' }}</button>
                <button class="btn" @click="traceModal.show=false">关闭</button>
            </div>
        </div>
    </div>
    </template>
</div>
    <script src="/static/app.js?v=20260919a"></script>
</body>
</html>
